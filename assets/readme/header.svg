<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="auto">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#101522"/>
      <stop offset="100%" stop-color="#080a0f"/>
    </linearGradient>

    <!-- Accent Blue Gradients -->
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2538" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#121724" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#1e293b" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.05"/>
    </pattern>
  </defs>

  <!-- Card Frame -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)"/>
  <rect width="1200" height="360" rx="16" fill="url(#grid)"/>
  <rect width="1198" height="358" x="1" y="1" rx="15" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Top Accent Horizon Line -->
  <path d="M 60 1 L 1140 1" stroke="url(#blueGlow)" stroke-width="2.5" opacity="0.8" filter="url(#glow)"/>

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="80" r="140" fill="#38bdf8" opacity="0.06" filter="url(#softGlow)"/>
  <circle cx="1000" cy="260" r="160" fill="#0284c7" opacity="0.05" filter="url(#softGlow)"/>

  <!-- Left: Brand Lockup -->
  <g transform="translate(70, 70)">
    <!-- Role Pill -->
    <rect width="280" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="14" cy="14" r="4" fill="#38bdf8" filter="url(#glow)"/>
    <text x="26" y="18" fill="#bae6fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">CREATOR OPERATIONS ARCHITECT</text>

    <!-- Main Name Title -->
    <text x="0" y="85" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="56" font-weight="800" letter-spacing="-1">
      hake<tspan fill="#38bdf8">.</tspan>
    </text>

    <!-- Core Slogan -->
    <text x="0" y="125" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="500" letter-spacing="-0.2">
      I manage. You create. <tspan fill="#f1f5f9" font-weight="600">We grow together.</tspan>
    </text>

    <!-- Subtitle / Value Prop -->
    <text x="0" y="155" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">
      Scaling YouTube channels, architecting resilient Discord ecosystems, and optimizing creator revenue.
    </text>

    <!-- Badges Row -->
    <g transform="translate(0, 185)">
      <!-- Pill 1 -->
      <g>
        <rect width="135" height="34" rx="8" fill="#131b2e" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.3"/>
        <text x="14" y="21" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700">25+</text>
        <text x="44" y="21" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="500">Communities</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(145, 0)">
        <rect width="125" height="34" rx="8" fill="#131b2e" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.3"/>
        <text x="14" y="21" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700">600M+</text>
        <text x="62" y="21" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="500">Views</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(280, 0)">
        <rect width="130" height="34" rx="8" fill="#131b2e" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.3"/>
        <text x="14" y="21" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700">100K+</text>
        <text x="62" y="21" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="500">Members</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(420, 0)">
        <rect width="135" height="34" rx="8" fill="#131b2e" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.3"/>
        <text x="14" y="21" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700">24h</text>
        <text x="44" y="21" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="500">Turnaround</text>
      </g>
    </g>
  </g>

  <!-- Right: Decorative Feature Card & Live Badge -->
  <g transform="translate(740, 50)">
    <!-- Glassmorphic Card -->
    <rect width="390" height="260" rx="14" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.25"/>

    <!-- Terminal Bar -->
    <path d="M 0 14 C 0 6.268 6.268 0 14 0 L 376 0 C 383.732 0 390 6.268 390 14 L 390 38 L 0 38 Z" fill="#0c101a"/>
    <circle cx="20" cy="19" r="5" fill="#ef4444"/>
    <circle cx="36" cy="19" r="5" fill="#f59e0b"/>
    <circle cx="52" cy="19" r="5" fill="#10b981"/>
    <text x="80" y="23" fill="#64748b" font-family="ui-monospace, monospace" font-size="11">hake-acc.vercel.app</text>

    <!-- Status badge -->
    <rect x="290" y="10" width="85" height="18" rx="9" fill="#064e3b" stroke="#10b981" stroke-width="1" stroke-opacity="0.5"/>
    <circle cx="300" cy="19" r="3" fill="#34d399"/>
    <text x="308" y="23" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="700">ONLINE</text>

    <!-- Code / Key Metrics list -->
    <g transform="translate(25, 60)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
      <!-- Line 1 -->
      <text y="15" fill="#38bdf8"><tspan fill="#f43f5e">const</tspan> creatorOps = {</text>
      <!-- Line 2 -->
      <text x="16" y="38" fill="#94a3b8">channelsManaged: <tspan fill="#f59e0b">"25+ creators"</tspan>,</text>
      <!-- Line 3 -->
      <text x="16" y="60" fill="#94a3b8">topViewsDriven: <tspan fill="#f59e0b">"600M+ views"</tspan>,</text>
      <!-- Line 4 -->
      <text x="16" y="82" fill="#94a3b8">discordReach: <tspan fill="#f59e0b">"100K+ users"</tspan>,</text>
      <!-- Line 5 -->
      <text x="16" y="104" fill="#94a3b8">serverRaids: <tspan fill="#10b981">"0 (zero incidents)"</tspan>,</text>
      <!-- Line 6 -->
      <text x="16" y="126" fill="#94a3b8">status: <tspan fill="#38bdf8">"Accepting Select Partners"</tspan></text>
      <!-- Line 7 -->
      <text y="150" fill="#38bdf8">};</text>

      <!-- Live Link CTA in card -->
      <g transform="translate(0, 165)">
        <rect width="340" height="28" rx="6" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4"/>
        <text x="80" y="18" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">⚡ Visit Portfolio ↗ hake-acc.vercel.app</text>
      </g>
    </g>
  </g>
</svg>
